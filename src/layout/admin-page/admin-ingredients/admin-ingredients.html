<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Manage Ingredients</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="admin-ingredients-styles.css" rel="stylesheet">
        <!--add in Montserrat font, font used on the uaschools website-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <div class="headerbar"><img src="/src/assets/bearbiteslogo.png"><a href="/src/layout/admin-page/admin-home/admin-home.html">Bear Bites</a></div>
        </header>
        <main>
            <h1>Manage Ingredients</h1>
            <p>
                Check a box to mark an ingredent as out of stock. 
                Uncheck a box to mark an ingredient as in stock. 
                Click "Save" when you are done to save your changes 
                to the website.
            </p>
            <form>
                <fieldset>
                    <legend>Bread</legend>
                    <label for="white-bread"><input type="checkbox"id="white-bread" value="white-bread" name="white-bread">White Bread</label>
                    <label for="wheat-bread"><input type="checkbox"id="wheat-bread" value="wheat-bread" name="wheat-bread">Wheat Bread</label>
                </fieldset>
                <fieldset>
                    <legend>Protein</legend>
                    <label for="turkey"><input type="checkbox"id="turkey" value="turkey" name="turkey">Oven Roasted Turkey</label>
                    <label for="bacon"><input type="checkbox"id="bacon" value="bacon" name="bacon">Bacon</label>
                    <label for="ham"><input type="checkbox"id="ham" value="ham" name="ham">Honey Ham</label>
                    <label for="salami"><input type="checkbox"id="salami" value="salami" name="salami">Salami</label>
                    <label for="pepperoni"><input type="checkbox"id="pepperoni" value="pepperoni" name="pepperoni">Pepperoni</label>
                    <label for="american"><input type="checkbox"id="american" value="american" name="american">American Cheese</label>
                    <label for="swiss"><input type="checkbox"id="swiss" value="swiss" name="swiss">Swiss Cheese</label>
                    <label for="cheddar"><input type="checkbox"id="cheddar" value="cheddar" name="cheddar">Cheddar Cheese</label>
                    <label for="hot-pepper"><input type="checkbox"id="hot-pepper" value="hot-pepper" name="hot-pepper">Hot Pepper Cheese</label>
                    <label for="provolone"><input type="checkbox"id="provolone" value="provolone" name="provolone">Provolone</label>
                    <label for="shredded-cheddar"><input type="checkbox"id="shredded-cheddar" value="shredded-cheddar" name="shredded-cheddar">Shredded Cheddar</label>
                </fieldset>
                <fieldset>
                    <legend>Toppings</legend>
                    <label for="onions"><input type="checkbox" id="onions" value="onions" name="onions">Onions</label>
                    <label for="cucumbers"><input type="checkbox" id="cucumbers" value="cucumbers" name="cucumbers">Cucumbers</label>
                    <label for="tomatoes"><input type="checkbox" id="tomatoes" value="tomatoes" name="tomatoes">Tomatoes</label>
                    <label for="olives"><input type="checkbox" id="olives" value="olives" name="olives">Olives</label>
                    <label for="spinach"><input type="checkbox" id="spinach" value="spinach" name="spinach">Spinach</label>
                    <label for="lettuce"><input type="checkbox" id="lettuce" value="lettuce" name="lettuce">Lettuce</label>
                    <label for="pickles"></label><input type="checkbox" id="pickles" value="pickles" name="pickles">Pickles</label>
                    <label for="jalepeno"><input type="checkbox" id="jalepeno" value="jalepeno" name="jalepeno">Jalepeños</label>
                    <label for="green-peppers"><input type="checkbox" id="green-peppers" value="green-peppers" name="green-peppers">Green Peppers</label>
                    <label for="hummus"><input type="checkbox" id="hummus" value="hummus" name="hummus">Hummus</label>
                    <label for="banana-peppers"><input type="checkbox" id="banana-peppers" value="banana-peppers" name="banana-peppers">Banana Peppers</label> 
                </fieldset>
                <fieldset>
                    <legend>Sauces</legend>
                    <label for="hot-sauce"><input type="checkbox" id="hot-sauce" value="hot-sauce" name="hot-sauce">Hot Sauce</label>
                    <label for="ranch"><input type="checkbox" id="ranch" value="ranch" name="ranch">Ranch</label>
                    <label for="mayo"><input type="checkbox" id="mayo" value="mayo" name="mayo">Mayonnaise</label>
                    <label for="ua-sauce"><input type="checkbox" id="ua-sauce" value="ua-sauce" name="ua-sauce">UA Sauce</label>
                </fieldset>
                <button type="submit" class="submit">Save Changes</button>
            </form>
        </main>
    </body>
</html>
