<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Manage Ingredients</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body>
        <h1>Manage Ingredients</h1>
        <p>
            Check a box to mark an ingredent as out of stock. 
            Uncheck a box to mark an ingredient as in stock. 
            Click "Save" when you are done to save your changes 
            to the website.
        </p>
        <form>
            <fieldset>
                <legend>Bread</legend>
                <input type="checkbox"id="white-bread" value="white-bread" name="white-bread"><label for="white-bread">White Bread</label>
                <input type="checkbox"id="wheat-bread" value="wheat-bread" name="wheat-bread"><label for="wheat-bread">Wheat Bread</label>
            </fieldset>
            <fieldset>
                <legend>Protein</legend>
                <input type="checkbox"id="turkey" value="turkey" name="turkey"><label for="turkey">Oven Roasted Turkey</label>
                <input type="checkbox"id="bacon" value="bacon" name="bacon"><label for="bacon">Bacon</label>
                <input type="checkbox"id="ham" value="ham" name="ham"><label for="ham">Honey Ham</label>
                <input type="checkbox"id="salami" value="salami" name="salami"><label for="salami">Salami</label>
                <input type="checkbox"id="pepperoni" value="pepperoni" name="pepperoni"><label for="pepperoni">Pepperoni</label>
                <input type="checkbox"id="american" value="american" name="american"><label for="american">American Cheese</label>
                <input type="checkbox"id="swiss" value="swiss" name=""><label for="">option</label>
                <input type="checkbox"id="" value="" name=""><label for="">option</label>
                <input type="checkbox"id="" value="" name=""><label for="">option</label>
                <input type="checkbox"id="" value="" name=""><label for="">option</label>
                <input type="checkbox"id="" value="" name=""><label for="">option</label>
            </fieldset>
            <fieldset>
                <legend>Toppings</legend>
            </fieldset>
            <fieldset>
                <legend>Sauces</legend>
            </fieldset>
        </form>
    </body>
</html>
