<script>
const form = document.querySelector("form"); 

form.addEventListener("submit", (event) => {
 total = countMeatsAndCheeses();
 if (total > 3) {
	 alert("You may only select a total of three meats and cheeses. You have "+total.toString()+"."); 
	 event.preventDefault(); //prevents form submission 
 }
}); 

function countMeatsAndCheeses() {
 var meats = document.getElementsByName("meat"); 
 var cheeses = document.getElementsByName("cheese"); 
 var total = 0; 
 for (let i=0; i < meats.length; ++i) {
	 if (meats[i].checked) {
		 total++; 
	 }
 }
 for (let i=0; i < cheeses.length; ++i) {
	 if (cheeses[i].checked) {
		 total++; 
	 }
 }
 return total; 
}
	document.getElementById('sub').addEventListener('submit', function(e){e.preventDefault();

var formData = new FormData(this);  
var csvContent = "data:text/csv; charset=utf-8,";

var fieldNames = Array.from(formData.keys());

csvContent += fieldNames.join(',') + "\n";

var fieldValues = Array.from(formData.values());

csvContent += fieldValues.join(',')+"\n";
var link = document.createElement('a');
link.href = encodeURI(csvContent);
link.target = '_blank';
link.download = 'survey_results.csv';
link.click();

this.reset();
});

</script>
