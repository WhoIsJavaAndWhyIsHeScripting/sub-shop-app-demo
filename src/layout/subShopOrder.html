   <!---Javascript verifying that meats and cheeses total to three.-->
   <script> 
   const form = document.querySelector("form"); 

   form.addEventListener("submit", (event) => {
    total = countMeatsAndCheeses();
    if (total > 3) {
        alert("You may only select a total of three meats and cheeses. You have "+total.toString()+"."); 
        event.preventDefault();  
    }
   }); 
   
   function countMeatsAndCheeses() {
    var meats = document.getElementsByName("meat"); 
    var cheeses = document.getElementsByName("cheese"); 
    var total = 0; 
    for (let i=0; i < meats.length; ++i) {
        if (meats[i].checked) {
            total++; 
        }
    }
    for (let i=0; i < cheeses.length; ++i) {
        if (cheeses[i].checked) {
            total++; 
        }
    }
    return total; 
   }
   </script>
