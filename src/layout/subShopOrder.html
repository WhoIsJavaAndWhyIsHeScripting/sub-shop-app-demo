<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel = "stylesheet" type = "text/css" href = "/boilerplate">

<link href="/boilerplate" rel="stylesheet">
<style type = "text/css">
body{
   font-family: Arial;
}
.myButton {
   box-shadow:inset 0px 1px 0px 0px #e3b022; 
   background-color:#ffbc03;
   border-radius:3px;
   border:1px solid #e3b022;
   display:inline-block;
   cursor:pointer;
   color:#000;
   font-family:Arial;
   font-size:13px;
   padding:15px 24px;
   text-decoration:none;
   text-shadow:0px 1px 0px #e3b022;
   text-align: center;
   width: 100vw;
}
nav{
	float: center;
}

.submit{
   all: unset;
   margin: 10px;
   background-color: var(--ua-gold);
   text-align: center;
   border-radius: 10px;
   width: 50%;
   padding: 10px 0;
}
h1 {
   font-size: 1.2em;
   font-weight: 600;
   padding: 10px;
}
p {
   padding: 10px;
   border-bottom: solid 1px gray;
}

#goBack {
   width: 50%;
   margin: 10px auto;
}
#goBackButton {
   all: unset;
   display: block;
   background-color: gray;
   color: white;
   padding: 15px 0;
   text-align: center;
   border-radius: 10px;
}
#goBackButton:visited {
   all: unset;
   color: white;
   text-decoration: none;
}
/* Hides submit button if there is no Javascript. */
@media (scripting: none) {
    .myButton[type="submit"] {
        display: none; 
    }
}

</style>

</head>
<body>
<div class = "box">
<nav>
   <a href="/" class="myButton">Return to Homepage!</a>
   <hr>
</nav>
<form action="/order-submit" method="POST" novalidate> <!-- Placeholder Path -->
   <!--this div contains the form minus the submit button, it will be
   replaced with the order summary-->
    <div id="the-form">
   <!-- Length Options-->
    <fieldset>
        
        <legend>Length Type</legend>
        <label>
            <input type="radio" name="inch" value="6"> 6 Inch
        </label><br>
        <label>
            <input type="radio" name="inch" value="12"> 12 Inch
        </label>
    </fieldset>
    
   <!-- Bread Options -->
   <fieldset>
       <legend>Bread Type</legend>
       <label>
           <input type="radio" name="bread" value="wheat"> Wheat Bread
       </label><br>
       <label>
           <input type="radio" name="bread" value="white"> White Bread
       </label>
       <label>
           <input type="radio" name="bread" value="salad"> Salad
       </label>
   </fieldset>

   <!-- Meat Options -->
   <fieldset>
       <legend>Meat Options</legend>
       <label>
           <input type="checkbox" name="protein" value="oven_roasted_turkey"> Oven Roasted Turkey
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="bacon"> Bacon
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="honey_ham"> Honey Ham
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="salami"> Salami
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="pepperoni"> Pepperoni
       </label>
   </fieldset>

   <!-- Cheese Options -->
   <fieldset>
       <legend>Cheese Options</legend>
       <label>
           <input type="checkbox" name="protein" value="american"> American Cheese
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="swiss"> Swiss Cheese
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="cheddar"> Cheddar Cheese
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="hot_pepper"> Hot Pepper Cheese
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="provolone"> Provolone Cheese
       </label><br>
       <label>
           <input type="checkbox" name="protein" value="shredded_cheddar"> Shredded Cheddar
       </label>
   </fieldset> 

   <!---Javascript verifying that meats and cheeses total to three.-->
   <script> 
   const form = document.querySelector("form"); 

   form.addEventListener("submit", (event) => {
    total = countMeatsAndCheeses();
    if (total > 3) {
        alert("You may only select a total of three meats and cheeses. You have "+total.toString()+"."); 
        event.preventDefault(); //prevents form submission 
    } else {
        const salad = document.querySelector('input[value="salad"]');  
        const lengths = document.querySelectorAll('input[name="inch"]'); 
        if (salad.checked && (lengths[0].checked || lengths[1].checked)) {
            alert("Length is ignored for salads. \n(No 12 inch salads!)");
        }
    }
   }); 
   
   function countMeatsAndCheeses() {
    var proteins = document.getElementsByName("protein"); 
    var total = 0; 
    for (let i=0; i < proteins.length; ++i) {
        if (proteins[i].checked) {
            total++; 
        }
    }
    return total; 
   }
   </script> 


   <!-- Veggie Options -->
   <fieldset>
       <legend>Vegetable Options</legend>
       <label>
           <input type="checkbox" name="veggies" value="onions"> Onions
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="cucumbers"> Cucumbers
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="tomatoes"> Tomatoes
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="olives"> Olives
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="spinach"> Spinach
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="lettuce"> Lettuce
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="pickles"> Pickles
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="jalapenos"> Jalapeños
       </label><br>
       <label>
           <input type="checkbox" name="veggies" value="green_peppers"> Green Peppers
       </label><br>
   </fieldset>

   <!-- Condiment Options -->
   <fieldset>
       <legend>Condiment Options</legend>
       <label>
           <input type="checkbox" name="condiments" value="hummus"> Hummus
       </label><br>
       <label>
           <input type="checkbox" name="condiments" value="banana_peppers"> Banana Peppers
       </label><br>
       <label>
           <input type="checkbox" name="condiments" value="hot_sauce"> Hot Sauce
       </label><br>
       <label>
           <input type="checkbox" name="condiments" value="ranch"> Ranch
       </label><br>
       <label>
           <input type="checkbox" name="condiments" value="mayo"> Mayo
       </label><br>
       <label>
           <input type="checkbox" name="condiments" value="ua_sauce"> UA Sauce
       </label>
   </fieldset>
   <button id="proceed" onclick="loadSummary()" type="button">Proceed</button>
   </div>
   <div style = "display: flex; justify-content: space-around; margin: 10px;">
      <input id="submit" type="submit" value="Submit" class="submit" style="visibility: hidden">
      <a id="goBack"></a>
   </div>
   <script>
      function loadSummary() {
         var orderForm = document.getElementById("the-form");
         var baseText = "";
         var len = findChecked('input[name="inch"]');
         var base = findChecked('input[name="bread"]');
         if (base == "salad") {
            baseText = `\nBase: ${base}`;
         } else {
            baseText = `\nBase: ${len} ${base}`;
         }
         var protein = findChecked('input[name="protein"]');
         var toppings = findChecked('input[name="veggies"]');
         var sauces = findChecked('input[name="condiments"]');
         var head = document.createElement('h1');
         head.textContent = "Here is your order:"
         orderForm.appendChild(head);
         var p1 = document.createElement('p');
         p1.textContent = baseText;
         orderForm.appendChild(p1);
         var p2 = document.createElement('p');
         p2.textContent = "Protein: " + protein;
         orderForm.appendChild(p2);
         var p3 = document.createElement('p');
         p3.textContent = "Toppings: " + toppings;
         orderForm.appendChild(p3);
         var p4 = document.createElement('p');
         p4.textContent = "Sauce: " + sauces;
         orderForm.appendChild(p4);
         var submitter = document.querySelector('input[type="submit"]');
         submitter.style = "visibility: visible";
         var goBack = document.createElement("a");
         goBack.textContent = "Cancel";
         goBack.href = "/order";
         goBack.id = "goBackButton";
         document.getElementById("goBack").appendChild(goBack);
      }
      function findChecked(query) {
         var itemsAll = document.querySelectorAll(query);
         var buttonchecked = "";
         alert("start");
         itemsAll.forEach((item) => {
            if (item.checked == true) {
               alert(item.checked);
               if (buttonchecked == "") {
                  buttonchecked += item.parentElement.textContent.trim();
               } else {
                  buttonchecked += ", " + item.parentElement.textContent.trim();
               }
               alert(item.checked);
               
            }
         })
         return buttonchecked;
      }
   </script>

   <!--Only appears if there is no Javascript.-->
   <noscript> 
    <h4><i>Javascript is need to submit this form.</i></h4>
   </noscript>

</form>
</div>
</body>
</html>
